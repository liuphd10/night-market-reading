<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Taiwanese night-market reading game: learn food characters, spell dish names, and order from a menu with no pictures.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>夜市識字</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-column night market street; each game is a stall (攤位) with a cream signboard. Single deliberate night theme. */
:root {
  --night: #1d1633;
  --night-2: #2b2148;
  --night-3: #3a2d5e;
  --lantern: #e8432e;
  --lantern-deep: #b52a1a;
  --amber: #ffb53b;
  --board: #fff3d6;
  --ink: #2b1d14;
  --ink-soft: #6b5442;
  --jade: #2fa37a;
  --mist: #c9bde6;
  --text: #fbf4ff;
  --zh: "LXGW WenKai TC", "BiauKai", "DFKai-SB", "Kaiti TC", "KaiTi", serif;
  --ui: "Nunito", "Segoe UI", system-ui, sans-serif;
  --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 500px at 50% -120px, #4a2a4f 0%, transparent 70%), var(--night);
  color: var(--text);
  font-family: var(--ui);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
.wrap { max-width: 880px; margin: 0 auto; }

/* string lights */
.lights { height: 34px; position: relative; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); overflow: hidden; }
.lights::before { content: ""; position: absolute; left: -2%; right: -2%; top: -30px; height: 50px; border-bottom: 2px solid #5b4a7a; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
.lights span { position: absolute; top: 10px; width: 12px; height: 16px; border-radius: 50% 50% 45% 45%; background: var(--amber); box-shadow: 0 0 12px 3px rgba(255,181,59,.6); animation: twinkle 3s infinite ease-in-out; }
.lights span:nth-child(3n) { background: var(--lantern); box-shadow: 0 0 12px 3px rgba(232,67,46,.6); }
@keyframes twinkle { 50% { opacity: .55; } }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 0 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--zh); font-weight: 700; font-size: clamp(30px, 6vw, 44px); margin: 0; color: var(--amber); text-shadow: 0 0 18px rgba(255,181,59,.45); letter-spacing: .04em; }
.brand small { color: var(--mist); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
.wallet { display: flex; gap: 8px; }
.pill { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
.home-btn { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 999px; padding: 6px 14px; font-weight: 800; }
.home-btn:hover { background: var(--night-3); }

/* home: stalls */
.intro { font-size: 17px; color: var(--mist); max-width: 62ch; margin: 0 0 22px; line-height: 1.55; }
.intro b { color: var(--text); }
.stalls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.stall { text-align: left; background: var(--night-2); border-radius: 18px; overflow: hidden; border: 1px solid var(--night-3); transition: transform .15s; display: flex; flex-direction: column; }
.stall:hover { transform: translateY(-3px); }
.awning { height: 22px; background: repeating-linear-gradient(90deg, var(--lantern) 0 28px, var(--board) 28px 56px); border-radius: 0 0 12px 12px / 0 0 10px 10px; }
.stall .sign { margin: 14px 16px 0; background: var(--board); color: var(--ink); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stall .sign .zh { font-family: var(--zh); font-weight: 700; font-size: 28px; }
.stall .sign .em { font-family: var(--emoji); font-size: 34px; }
.stall .body { padding: 12px 16px 16px; display: grid; gap: 6px; }
.stall .lvl { color: var(--amber); font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.stall p { margin: 0; color: var(--mist); line-height: 1.45; }
.minirow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.ghost { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 12px; padding: 12px 16px; font-weight: 800; display: inline-flex; gap: 8px; align-items: center; }
.ghost:hover { background: var(--night-3); }
.parent { margin-top: 28px; color: var(--mist); font-size: 14px; line-height: 1.55; border-top: 1px dashed var(--night-3); padding-top: 16px; }
.parent b { color: var(--text); }

/* generic game panel */
.panel { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 20px; padding: 20px; }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; color: var(--mist); font-weight: 800; }
.progress { flex: 1 1 160px; height: 10px; background: var(--night); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--lantern), var(--amber)); border-radius: 99px; transition: width .3s; }
.prompt { display: grid; justify-items: center; gap: 8px; padding: 10px 0 18px; text-align: center; }
.bigzh { font-family: var(--zh); font-weight: 700; font-size: clamp(96px, 26vw, 150px); line-height: 1; background: var(--board); color: var(--ink); border-radius: 22px; padding: 10px 28px 18px; box-shadow: 0 0 0 6px var(--lantern), 0 0 40px rgba(232,67,46,.35); }
.bigemoji { font-family: var(--emoji); font-size: clamp(90px, 24vw, 130px); line-height: 1.1; }
.question { font-size: 18px; font-weight: 800; }
.hint-en { color: var(--mist); font-weight: 800; font-size: 15px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 640px) { .choices { grid-template-columns: repeat(4, 1fr); } }
.choice { background: var(--board); color: var(--ink); border-radius: 16px; min-height: 104px; display: grid; place-items: center; box-shadow: 0 5px 0 #d9c49a; transition: transform .08s; }
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9c49a; }
.choice.zh { font-family: var(--zh); font-weight: 700; font-size: 58px; }
.choice.pic { display: grid; place-items: center; align-content: center; gap: 2px; padding: 8px 4px; }
.choice.pic .pe { font-family: var(--emoji); font-size: 52px; line-height: 1.1; }
.choice.pic .pl { font-weight: 800; font-size: 15px; color: var(--ink-soft); }
.choice.right { background: #c9f1de; box-shadow: 0 5px 0 var(--jade); }
.choice.wrong { background: #ffd0c7; box-shadow: 0 5px 0 var(--lantern); animation: shake .35s; }
.choice[disabled] { cursor: default; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tool { background: var(--night-3); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; }
.tool:hover { background: #4a3a74; }
.tool .cost { color: var(--amber); }
.feedback { margin-top: 16px; background: var(--night); border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.feedback .fzh { font-family: var(--zh); font-size: 44px; font-weight: 700; color: var(--amber); }
.feedback .fmeta { flex: 1 1 200px; min-width: 0; line-height: 1.45; }
.feedback .py { font-weight: 800; font-size: 18px; }
.feedback .tip { color: var(--mist); font-size: 15px; }
.next { background: var(--lantern); color: #fff; border-radius: 14px; padding: 12px 22px; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 var(--lantern-deep); }
.next:hover { filter: brightness(1.08); }
.good { color: #7fe0b5; } .bad { color: #ff9b8a; }

/* learn cards */
.group-title { font-family: var(--zh); font-size: 26px; color: var(--amber); margin: 22px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.group-title small { font-family: var(--ui); font-size: 13px; color: var(--mist); letter-spacing: .06em; text-transform: uppercase; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.card { perspective: 600px; height: 158px; }
.card .inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.card.flip .inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; display: grid; place-items: center; text-align: center; padding: 8px; }
.front { background: var(--board); color: var(--ink); }
.front .c { font-family: var(--zh); font-weight: 700; font-size: 70px; line-height: 1; }
.dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: #e3d3ad; }
.dots i.on { background: var(--lantern); }
.back { background: var(--night-3); transform: rotateY(180deg); align-content: center; gap: 2px; }
.back .e { font-family: var(--emoji); font-size: 34px; }
.back .p { font-weight: 800; color: var(--amber); }
.back .t { font-size: 12px; color: var(--mist); line-height: 1.3; }

/* build */
.slots { display: flex; gap: 10px; justify-content: center; margin: 6px 0 18px; flex-wrap: wrap; }
.slot { width: 74px; height: 84px; border-radius: 14px; border: 3px dashed var(--mist); display: grid; place-items: center; font-family: var(--zh); font-weight: 700; font-size: 52px; }
.slot.filled { border: 0; background: var(--board); color: var(--ink); animation: pop .25s; }
@keyframes pop { 50% { transform: scale(1.12); } }
.tiles { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.tile { width: 74px; height: 80px; border-radius: 14px; background: var(--board); color: var(--ink); font-family: var(--zh); font-weight: 700; font-size: 48px; box-shadow: 0 5px 0 #d9c49a; }
.tile.used { visibility: hidden; }
.tile.wrong { background: #ffd0c7; animation: shake .35s; }

/* order */
.order-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 760px) { .order-grid { grid-template-columns: 300px 1fr; align-items: start; } }
.customer { background: var(--night); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.cust-head { display: flex; align-items: center; gap: 10px; }
.cust-head .av { font-family: var(--emoji); font-size: 44px; }
.bubble { background: #fff; color: var(--ink); border-radius: 16px; padding: 12px; display: grid; gap: 8px; justify-items: center; position: relative; }
.bubble::before { content: ""; position: absolute; top: -10px; left: 26px; border: 10px solid transparent; border-top: 0; border-bottom-color: #fff; }
.bubble .dish { font-family: var(--emoji); font-size: 70px; line-height: 1.1; position: relative; }
.bubble .qty { position: absolute; right: -24px; bottom: 4px; background: var(--lantern); color: #fff; font-family: var(--ui); font-weight: 800; font-size: 20px; border-radius: 999px; padding: 2px 9px; }
.reqs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.req { background: #f3ead6; border-radius: 999px; padding: 4px 10px; font-size: 14px; font-weight: 800; }
.req .ri { font-family: var(--emoji); }
.req.done { background: #c9f1de; }
.vendor-line { font-family: var(--zh); font-size: 22px; color: var(--amber); }
.menu { background: var(--board); color: var(--ink); border-radius: 14px; padding: 14px; border: 6px solid var(--lantern); }
.menu h3 { font-family: var(--zh); font-size: 28px; margin: 0 0 8px; text-align: center; letter-spacing: .3em; color: var(--lantern-deep); }
.menu-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mi { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 10px; border-radius: 10px; border-bottom: 2px dotted #d9c49a; text-align: left; font-family: var(--zh); }
.mi:hover { background: #f6e6bf; }
.mi .n { font-weight: 700; font-size: 26px; }
.mi .pr { font-size: 18px; color: var(--lantern-deep); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mi.wrong { background: #ffd0c7; animation: shake .35s; }
.mi.right { background: #c9f1de; }
.optbox { margin-top: 14px; background: var(--night); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.optbox .q { font-family: var(--zh); font-size: 24px; color: var(--amber); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; }
.opt { background: var(--board); color: var(--ink); border-radius: 12px; padding: 10px 18px; font-family: var(--zh); font-weight: 700; font-size: 28px; box-shadow: 0 4px 0 #d9c49a; }
.opt.wrong { background: #ffd0c7; animation: shake .35s; }
.opt.right { background: #c9f1de; }
.hearts { font-family: var(--emoji); letter-spacing: 2px; }

/* results + stamps */
.result { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 18px 0; }
.result .stars { font-family: var(--emoji); font-size: 54px; letter-spacing: 6px; }
.result h2 { font-family: var(--zh); font-size: 40px; margin: 0; color: var(--amber); }
.stamp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.stamp { background: var(--board); color: var(--ink); border-radius: 16px; padding: 12px 8px; text-align: center; display: grid; gap: 4px; border: 3px dashed #d9c49a; }
.stamp .e { font-family: var(--emoji); font-size: 44px; }
.stamp .n { font-family: var(--zh); font-weight: 700; font-size: 22px; }
.stamp .p { font-size: 12px; color: var(--ink-soft); font-weight: 800; }
.stamp.got { border: 3px solid var(--lantern); position: relative; }
.stamp.got::after { content: "吃過"; position: absolute; top: 6px; right: 6px; font-family: var(--zh); font-size: 13px; color: var(--lantern); border: 2px solid var(--lantern); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; transform: rotate(-14deg); }
.stamp.locked .e { filter: grayscale(1) brightness(.4); }
.stamp.locked .n { color: #c9b994; }

ruby { ruby-position: over; }
rt { font-family: var(--ui); font-weight: 800; font-size: max(12px, .26em); letter-spacing: 0; color: var(--lantern-deep); line-height: 1.1; }
body.no-py rt { display: none; }
.pytoggle { background: var(--night-2); border: 1px solid var(--night-3); border-radius: 999px; padding: 6px 12px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.pytoggle .sw { width: 34px; height: 20px; border-radius: 99px; background: var(--night-3); position: relative; transition: background .2s; }
.pytoggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mist); transition: transform .2s; }
.pytoggle[aria-pressed="true"] .sw { background: var(--jade); }
.pytoggle[aria-pressed="true"] .sw::after { transform: translateX(14px); background: #fff; }
.photo { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo-frame { width: min(300px, 78vw); aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 6px var(--board), 0 0 0 10px var(--lantern), 0 0 40px rgba(232,67,46,.35); background: var(--night); }
.bubble .dish { font-size: 14px; width: 220px; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: visible; }
.bubble .dish .photo { border-radius: 12px; }
.stall .sign .thumb { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; border: 3px solid var(--lantern); flex: none; }
.stamp .pic { width: 100%; aspect-ratio: 1; border-radius: 10px; overflow: hidden; }
.stamp.locked .pic { filter: grayscale(1) brightness(.35) blur(2px); }
.credits { display: grid; gap: 10px; }
.credit { display: flex; gap: 12px; align-items: center; background: var(--night-2); border-radius: 12px; padding: 8px; }
.credit .cpic { width: 64px; height: 64px; border-radius: 8px; overflow: hidden; flex: none; }
.credit .ctext { min-width: 0; font-size: 14px; line-height: 1.4; color: var(--mist); overflow-wrap: anywhere; }
.credit .ctext b { font-family: var(--zh); font-size: 18px; color: var(--text); }
.credit a { color: var(--amber); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--amber); color: var(--ink); font-weight: 800; padding: 10px 18px; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 20; }
.stinky { display: inline-block; animation: stink 1.6s infinite; }
@keyframes stink { 50% { transform: rotate(-6deg) scale(1.05); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="lights" aria-hidden="true" id="lights"></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>夜市識字</h1><small>Night Market Reading</small></div>
    <div class="wallet">
      <button class="pytoggle" id="pyBtn" aria-pressed="false" title="Show pinyin above characters">拼音 pīnyīn <span class="sw"></span></button>
      <span class="pill" title="Night-market coins">💰 <span id="coins">0</span></span>
      <span class="pill" title="Stamps collected">🏮 <span id="stampCount">0</span>/<span id="stampTotal">0</span></span>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- data ---------- */
const CHARS = [
  // 食物 food words
  { c:"牛", py:"niú", en:"cow / beef", e:"🐄", lab:"cow", g:"food", tip:"Looks like a cow's face with two horns on top." },
  { c:"肉", py:"ròu", en:"meat", e:"🥩", lab:"meat", g:"food", tip:"A slice of meat with lines of fat inside." },
  { c:"麵", py:"miàn", en:"noodles", e:"🍜", lab:"noodles", g:"food", tip:"Left side 麥 means wheat. Noodles are made from wheat." },
  { c:"雞", py:"jī", en:"chicken", e:"🐔", lab:"chicken", g:"food", tip:"Right side 隹 is an old drawing of a bird." },
  { c:"豬", py:"zhū", en:"pig / pork", e:"🐷", lab:"pig", g:"food", tip:"Left side 豕 is an old drawing of a pig." },
  { c:"魚", py:"yú", en:"fish", e:"🐟", lab:"fish", g:"food", tip:"Head on top, body in the middle, tail 灬 at the bottom." },
  { c:"蛋", py:"dàn", en:"egg", e:"🥚", lab:"egg", g:"food", tip:"虫 (bug) at the bottom: little creatures hatch from eggs." },
  { c:"飯", py:"fàn", en:"rice / meal", e:"🍚", lab:"cooked rice", g:"food", tip:"Left side 飠 means FOOD. Look for it on the menu!" },
  { c:"米", py:"mǐ", en:"rice grains", e:"🌾", lab:"rice plant", g:"food", tip:"Rice grains scattered around a cross." },
  { c:"茶", py:"chá", en:"tea", e:"🍵", lab:"tea", g:"food", tip:"艹 on top means plant. Tea is made from leaves." },
  { c:"奶", py:"nǎi", en:"milk", e:"🥛", lab:"milk", g:"food", tip:"女 (woman) on the left: milk comes from mom." },
  { c:"冰", py:"bīng", en:"ice", e:"🧊", lab:"ice", g:"food", tip:"冫 two drops on the left means ice or cold." },
  { c:"湯", py:"tāng", en:"soup", e:"🍲", lab:"soup", g:"food", tip:"氵 three drops on the left means water." },
  { c:"包", py:"bāo", en:"bun / wrap", e:"🥟", lab:"bun", g:"food", tip:"Something wrapped up inside: a bun!" },
  { c:"餅", py:"bǐng", en:"pancake / flatbread", e:"🥞", lab:"pancake", g:"food", tip:"飠 on the left again. It's food!" },
  { c:"豆", py:"dòu", en:"bean", e:"🥜", lab:"beans", g:"food", tip:"An old bowl on a stand, used to hold beans." },
  { c:"油", py:"yóu", en:"oil", e:"🛢️", lab:"oil", g:"food", tip:"氵 means liquid. Oil is a liquid." },
  { c:"炒", py:"chǎo", en:"stir-fry", e:"🍳", lab:"stir-fry", g:"food", tip:"火 (fire) on the left. You need fire to stir-fry." },
  // 味道 taste words
  { c:"臭", py:"chòu", en:"stinky", e:"🤢", lab:"stinky", g:"taste", tip:"自 (nose) on top of 犬 (dog). A dog's nose smells EVERYTHING." },
  { c:"甜", py:"tián", en:"sweet", e:"🍰", lab:"sweet", g:"taste", tip:"舌 (tongue) + 甘 (sweet): sweet on your tongue." },
  { c:"辣", py:"là", en:"spicy", e:"🌶️", lab:"spicy", g:"taste", tip:"辛 on the left means hot and burning." },
  { c:"糖", py:"táng", en:"sugar", e:"🍬", lab:"sugar", g:"taste", tip:"米 on the left: old sugar was made from rice." },
  { c:"香", py:"xiāng", en:"yummy smell", e:"😋", lab:"smells yummy", g:"taste", tip:"禾 (grain) over 日 (sun): warm grain smells good." },
  // 點餐 ordering words

const $app = document.getElementById("app");
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch]));
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
function spend(n) { if (S.coins < n) { toast("錢不夠了！Not enough coins 💰"); return false; } S.coins -= n; save(); return true; }
function dishEmoji(d) { return d.stinky ? `<span class="stinky">${d.e}</span>💨` : d.e; }

// speech (Taiwan Mandarin voice when the device has one)
let zhVoice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); zhVoice = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh/i.test(v.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "zh-TW"; if (zhVoice) u.voice = zhVoice; u.rate = 0.8; speechSynthesis.speak(u); } catch (e) {}
}
// little sound effects
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 170];
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = ok ? "triangle" : "square"; o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + i * .11; o.start(t); g.gain.exponentialRampToValueAtTime(.001, t + .16); o.stop(t + .17); });
  } catch (e) {}
}

/* ---------- stall 1: quiz ---------- */
let Q;
function startQuiz() {
  const pool = shuffle(CHARS).sort((a, b) => mastery(a.c) - mastery(b.c));
  Q = { i: 0, n: 10, right: 0, streak: 0, best: 0, earned: 0, list: shuffle(pool.slice(0, 10)) };
  quizQ();
}
const CONFUSE = [["飯","米"], ["甜","糖"], ["湯","碗"], ["小","少"], ["冰","去"], ["雞","蛋"], ["豬","肉"], ["牛","肉"], ["不","去"]];
function quizQ() {
  if (Q.i >= Q.n) return quizEnd();
  const c = Q.list[Q.i];
  const type = Math.random() < 0.65 ? "read" : "find";
  const clash = CONFUSE.find(g => g.includes(c.c)) || [];
  const others = sample(CHARS.filter(x => x.c !== c.c && x.e !== c.e && !clash.includes(x.c)), 3);
  const opts = shuffle([c, ...others]);
  Q.cur = { c, type, hinted: false, done: false };
  const prompt = type === "read"
    ? `<div class="question">這個字是什麼？ Which picture matches?</div><div class="bigzh">${zh(c.c)}</div>`
    : `<div class="question">哪一個字？ Find the character</div><div class="bigemoji">${c.e}</div><div class="hint-en">${esc(c.lab)}</div>`;
  $app.innerHTML = `${backBar(`第 ${Q.i + 1} 題 / ${Q.n} · 🔥 ${Q.streak}`)}
    <div class="panel">
      <div class="hud"><div class="progress"><i style="width:${Q.i / Q.n * 100}%"></i></div></div>
      <div class="prompt">${prompt}</div>
      <div class="choices">${opts.map(o => type === "read"
        ? `<button class="choice pic" data-a="${o.c}" aria-label="${esc(o.lab)}"><span class="pe">${o.e}</span><span class="pl">${esc(o.lab)}</span></button>`
        : `<button class="choice zh" data-a="${o.c}">${zh(o.c)}</button>`).join("")}</div>
      <div class="tools" style="margin-top:14px"><button class="tool" id="hint">🔊 聽一聽 hint <span class="cost">−1💰</span></button></div>
      <div id="fb"></div>
    </div>`;
  document.getElementById("hint").onclick = () => { if (Q.cur.done) return; if (!Q.cur.hinted && !spend(1)) return; Q.cur.hinted = true; speak(c.c); };
  $app.querySelectorAll(".choice").forEach(b => b.onclick = () => quizAnswer(b));
}
function quizAnswer(btn) {
  const cur = Q.cur; if (cur.done) return;
  const ok = btn.dataset.a === cur.c.c;
  if (!ok) {
    btn.classList.add("wrong"); btn.disabled = true; beep(false);
    Q.streak = 0; cur.missed = true;
    S.m[cur.c.c] = Math.max(0, mastery(cur.c.c) - 1); save();
    return;
  }
  cur.done = true; btn.classList.add("right"); beep(true); speak(cur.c.c);
  $app.querySelectorAll(".choice").forEach(b => b.disabled = true);
  if (!cur.missed) {
    Q.right++; Q.streak++; Q.best = Math.max(Q.best, Q.streak);
    let gain = cur.hinted ? 1 : 2; if (Q.streak > 0 && Q.streak % 5 === 0) { gain += 5; toast(`🔥 ${Q.streak} in a row! +5💰`); }
    S.coins += gain; Q.earned += gain;
    if (!cur.hinted) S.m[cur.c.c] = Math.min(3, mastery(cur.c.c) + 1);
    save();
  }
  document.getElementById("fb").innerHTML = `<div class="feedback">
    <span class="fzh">${cur.c.c}</span>
    <div class="fmeta"><div class="py">${cur.c.py} · ${esc(cur.c.en)} ${cur.missed ? '<span class="bad">· 再練習</span>' : '<span class="good">· 答對了！</span>'}</div><div class="tip">${esc(cur.c.tip)}</div></div>
    <button class="next" id="nx">下一題 →</button></div>`;
  document.getElementById("nx").onclick = () => { Q.i++; quizQ(); };
  document.getElementById("nx").focus();
}
function quizEnd() {
  const stars = Q.right >= 9 ? 3 : Q.right >= 7 ? 2 : Q.right >= 4 ? 1 : 0;
  resultScreen(stars, `${Q.right} / ${Q.n} 答對 · best streak 🔥${Q.best} · +${Q.earned}💰`, "quiz");
}

/* ---------- stall 2: build the dish name ---------- */
let B;
function startBuild() {
  const order = shuffle(DISHES).sort((a, b) => (S.stamps[a.n] ? 1 : 0) - (S.stamps[b.n] ? 1 : 0));
  B = { i: 0, n: 6, list: shuffle(order.slice(0, 6)), perfect: 0, earned: 0 };
  buildQ();
}
function buildQ() {
  if (B.i >= B.n) return buildEnd();
  const d = B.list[B.i];
  const chars = [...d.n];
  const pool = [...new Set(DISHES.filter(x => x.n !== d.n).flatMap(x => [...x.n]))].filter(ch => !chars.includes(ch));
  const tiles = shuffle([...chars, ...sample(pool, Math.max(3, 7 - chars.length))]);
  B.cur = { d, chars, pos: 0, miss: 0, hinted: false };
  $app.innerHTML = `${backBar(`第 ${B.i + 1} 道菜 / ${B.n}`)}
    <div class="panel">
      <div class="hud"><div class="progress"><i style="width:${B.i / B.n * 100}%"></i></div></div>
      <div class="prompt"><div class="question">這道菜叫什麼？ Spell this dish</div><div class="photo-frame">${pic(d)}</div><div class="hint-en" id="en">&nbsp;</div></div>
      <div class="slots">${chars.map((_, k) => `<div class="slot" id="s${k}"></div>`).join("")}</div>
      <div class="tiles">${tiles.map((t, k) => `<button class="tile" data-t="${t}" id="t${k}">${zh(t)}</button>`).join("")}</div>
      <div class="tools" style="margin-top:16px">
        <button class="tool" id="say">🔊 聽菜名 hear it <span class="cost">−1💰</span></button>
        <button class="tool" id="eng">🇺🇸 English <span class="cost">−1💰</span></button>
      </div>
      <div id="fb"></div>
    </div>`;
  document.getElementById("say").onclick = () => { if (!B.cur.paidSay && !spend(1)) return; B.cur.paidSay = true; B.cur.hinted = true; speak(d.n); };
  document.getElementById("eng").onclick = () => { if (B.cur.paidEn) return; if (!spend(1)) return; B.cur.paidEn = true; B.cur.hinted = true; document.getElementById("en").textContent = d.en; };
  $app.querySelectorAll(".tile").forEach(t => t.onclick = () => buildTap(t));
}
function buildTap(t) {
  const cur = B.cur; if (cur.pos >= cur.chars.length) return;
  if (t.dataset.t === cur.chars[cur.pos]) {
    const s = document.getElementById("s" + cur.pos); s.innerHTML = zh(t.dataset.t); s.classList.add("filled");
    t.classList.add("used"); cur.pos++; beep(true);
    if (cur.pos === cur.chars.length) buildDone();
  } else {
    cur.miss++; beep(false); t.classList.remove("wrong"); void t.offsetWidth; t.classList.add("wrong");
  }
}
function buildDone() {
  const { d, miss, hinted } = B.cur;
  speak(d.n);
  let gain = miss === 0 ? (hinted ? 2 : 4) : 1;
  const newStamp = miss <= 1 && !S.stamps[d.n];
  if (miss <= 1) S.stamps[d.n] = true;
  if (miss === 0) B.perfect++;
  S.coins += gain; B.earned += gain; save();
  document.getElementById("fb").innerHTML = `<div class="feedback">
    <span class="fzh">${d.n}</span>
    <div class="fmeta"><div class="py">${d.py} · ${esc(d.en)}</div><div class="tip">NT$${d.p} at the night market · ${miss === 0 ? '<span class="good">完美！Perfect</span>' : `<span class="bad">${miss} mistake${miss > 1 ? "s" : ""}</span>`}${newStamp ? " · 🏮 new stamp!" : ""}</div></div>
    <button class="next" id="nx">下一道 →</button></div>`;
  document.getElementById("nx").onclick = () => { B.i++; buildQ(); };
  document.getElementById("nx").focus();
}
function buildEnd() {
  const stars = B.perfect >= 6 ? 3 : B.perfect >= 4 ? 2 : B.perfect >= 2 ? 1 : 0;
  resultScreen(stars, `${B.perfect} / ${B.n} perfect · +${B.earned}💰`, "build");
}

/* ---------- stall 3: order at the stall ---------- */
let O;
function startOrder() {
  const menu = sample(DISHES, 9);
  const want = sample(menu, 5);
  O = { i: 0, n: 5, hearts: 3, menu, served: 0, earned: 0,
    list: want.map((d, k) => {
      const groups = k === 0 ? [] : CAT_OPTS[d.cat];
      const choices = groups.map(g => ({ g, pick: OPTS[g].items[rnd(OPTS[g].items.length)] }));
      const qty = k >= 2 ? 1 + rnd(2) : 1;
      return { d, choices, qty, who: CUSTOMERS[rnd(CUSTOMERS.length)] };
    }) };
  orderQ();
}
function orderTotal(o) { return (o.d.p + o.choices.reduce((s, c) => s + (c.pick.add || 0), 0)) * o.qty; }
function orderQ() {
  if (O.i >= O.n || O.hearts <= 0) return orderEnd();
  const o = O.list[O.i];
  O.cur = { o, step: "dish", optIdx: 0, done: [] };
  orderRender();
  speak("你好！要吃什麼？");
}
function orderRender() {
  const { o } = O.cur;
  const reqs = o.choices.map((c, k) => `<span class="req ${O.cur.done[k] ? "done" : ""}"><span class="ri">${c.pick.ri}</span> ${esc(c.pick.en)}</span>`).join("");
  $app.innerHTML = `${backBar(`客人 ${O.i + 1} / ${O.n} · <span class="hearts">${"❤️".repeat(O.hearts)}${"🖤".repeat(3 - O.hearts)}</span>`)}
    <div class="order-grid">
      <div class="customer">
        <div class="cust-head"><span class="av">${o.who}</span><span class="vendor-line" id="vline">老闆，我要…</span></div>
        <div class="bubble">
          <div class="dish">${pic(o.d)}${o.qty > 1 ? `<span class="qty">×${o.qty}</span>` : ""}</div>
          ${reqs ? `<div class="reqs">${reqs}</div>` : ""}
        </div>
        <div class="tools"><button class="tool" id="peek">❓ What is it? <span class="cost">−1💰</span></button></div>
        <div class="hint-en" id="peekout" style="text-align:center"></div>
      </div>
      <div>
        <div class="menu"><h3>${zh("夜市小吃")}</h3><div class="menu-items">${O.menu.map((d, k) => `<button class="mi" data-k="${k}"><span class="n">${zh(d.n)}</span><span class="pr">${d.p}元</span></button>`).join("")}</div></div>
        <div id="stepbox"></div>
      </div>
    </div>`;
  document.getElementById("peek").onclick = () => { if (O.cur.peeked) return; if (!spend(1)) return; O.cur.peeked = true; document.getElementById("peekout").textContent = o.d.en; };
  $app.querySelectorAll(".mi").forEach(b => b.onclick = () => orderPickDish(b));
}
function loseHeart() {
  O.hearts--; beep(false);
  document.querySelector(".hud .hearts").textContent = "❤️".repeat(Math.max(0, O.hearts)) + "🖤".repeat(3 - Math.max(0, O.hearts));
  if (O.hearts <= 0) setTimeout(orderEnd, 900);
}
function orderPickDish(btn) {
  if (O.cur.step !== "dish" || O.hearts <= 0) return;
  const d = O.menu[+btn.dataset.k];
  if (d.n !== O.cur.o.d.n) {
    btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
    toast(`${d.n} = ${d.en}`); speak(d.n); loseHeart(); return;
  }
  btn.classList.add("right"); beep(true); speak(d.n);
  O.cur.step = "opts"; orderNextOpt();
}
function orderNextOpt() {
  const { o } = O.cur; const box = document.getElementById("stepbox");
  if (O.cur.optIdx < o.choices.length) {
    const c = o.choices[O.cur.optIdx]; const def = OPTS[c.g];
    box.innerHTML = `<div class="optbox"><div class="q">老闆：${def.q}</div><div class="opts">${shuffle(def.items).map(it => `<button class="opt" data-t="${it.t}">${zh(it.t)}</button>`).join("")}</div></div>`;
    speak(def.q);
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (O.hearts <= 0) return;
      if (b.dataset.t === c.pick.t) {
        b.classList.add("right"); beep(true); speak(c.pick.t);
        O.cur.done[O.cur.optIdx] = true; O.cur.optIdx++;
        document.querySelectorAll(".req")[O.cur.optIdx - 1].classList.add("done");
        setTimeout(orderNextOpt, 450);
      } else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); loseHeart(); }
    });
    return;
  }
  if (O.i >= 2 && !O.cur.qtyDone) return orderQty();
  orderPay();
}
function orderQty() {
  const { o } = O.cur; const box = document.getElementById("stepbox");
  const otherM = ["杯", "碗", "份"].filter(m => m !== o.d.m)[rnd(2)];
  const right = NUM[o.qty] + o.d.m;
  const choices = shuffle([NUM[1] + o.d.m, NUM[2] + o.d.m, NUM[1] + otherM, NUM[2] + otherM]);
  box.innerHTML = `<div class="optbox"><div class="q">老闆：要幾${o.d.m === "份" ? "份" : o.d.m}？ How many?</div><div class="opts">${choices.map(t => `<button class="opt" data-t="${t}">${zh(t)}</button>`).join("")}</div></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (O.hearts <= 0) return;
    if (b.dataset.t === right) { b.classList.add("right"); beep(true); speak(right); O.cur.qtyDone = true; setTimeout(orderPay, 450); }
    else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); toast(`${o.d.n} uses ${o.d.m}`); loseHeart(); }
  });
}
function orderPay() {
  const { o } = O.cur; const box = document.getElementById("stepbox");
  const total = orderTotal(o);
  const extras = o.choices.filter(c => c.pick.add).map(c => `${c.pick.t} +${c.pick.add}元`);
  const wrongs = new Set(); while (wrongs.size < 2) { const w = total + (rnd(2) ? 1 : -1) * (5 * (1 + rnd(4))); if (w > 0 && w !== total) wrongs.add(w); }
  box.innerHTML = `<div class="optbox"><div class="q">老闆：一共多少錢？ How much in total?</div>
    <div class="tip" style="color:var(--mist)">Find the price on the menu.${extras.length ? " Extra: " + extras.join(", ") + "." : ""}${o.qty > 1 ? ` You ordered ${o.qty}.` : ""}</div>
    <div class="opts">${shuffle([total, ...wrongs]).map(v => `<button class="opt" data-v="${v}">${v}元</button>`).join("")}</div></div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (O.hearts <= 0) return;
    if (+b.dataset.v === total) {
      b.classList.add("right"); beep(true); speak("謝謝！");
      const newStamp = !S.stamps[o.d.n]; S.stamps[o.d.n] = true;
      const gain = 3 + O.i; S.coins += gain; O.earned += gain; O.served++; save();
      box.insertAdjacentHTML("beforeend", `<div class="feedback"><span class="fzh">謝謝！</span><div class="fmeta"><div class="py">${o.d.n} · ${o.d.py}</div><div class="tip">+${gain}💰${newStamp ? " · 🏮 new stamp!" : ""}</div></div><button class="next" id="nx">下一位 →</button></div>`);
      document.getElementById("nx").onclick = () => { O.i++; orderQ(); };
      document.getElementById("nx").focus();
    } else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); loseHeart(); }
  });
}
function orderEnd() {
  const stars = O.hearts <= 0 ? 0 : O.hearts === 3 ? 3 : O.hearts === 2 ? 2 : 1;
  resultScreen(stars, `${O.served} / ${O.n} customers served · ${"❤️".repeat(Math.max(0, O.hearts))} left · +${O.earned}💰`, "order", O.hearts <= 0 ? "收攤了！Out of hearts" : null);
}

/* ---------- results + stamps ---------- */
function resultScreen(stars, line, again, title) {
  const titles = ["再試一次！", "不錯喔！", "很棒！", "太厲害了！"];
  $app.innerHTML = `${backBar("結果 Results")}<div class="panel"><div class="result">
    <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <h2>${title || titles[stars]}</h2><div class="hint-en">${line}</div>
    <div class="minirow" style="justify-content:center"><button class="next" data-go="${again}">再玩一次 Play again</button><button class="ghost" data-go="home">← 回夜市</button></div>
  </div></div>`;
  if (stars === 3) speak("太厲害了！");
}
function stamps() {
  const got = Object.keys(S.stamps).length;
  $app.innerHTML = `${backBar(`集點卡 · ${got}/${DISHES.length}`)}
    <p class="intro">Every dish you spell well or order correctly gets a 吃過 stamp. Collect all ${DISHES.length} to become a <b>夜市達人</b> (night market master).</p>
    <div class="stamp-grid">${DISHES.map(d => S.stamps[d.n]
      ? `<div class="stamp got"><div class="pic">${pic(d)}</div><span class="n">${d.n}</span><span class="p">${d.py}</span></div>`
      : `<div class="stamp locked"><div class="pic">${pic(d)}</div><span class="n">？？？</span><span class="p">NT$${d.p}</span></div>`).join("")}</div>`;
}

function credits() {
  $app.innerHTML = `${backBar("照片來源 · Photo credits")}
    <p class="intro">All dish photos are real photos from <b>Wikimedia Commons</b>, used under their free licenses. They were resized, and two were cropped.</p>
    <div class="credits">${DISHES.map(d => { const p = PHOTOS[d.n]; return `<div class="credit"><div class="cpic">${pic(d)}</div><div class="ctext"><b>${d.n}</b><br>
      <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(p[1].replace(/ /g, "_"))}" target="_blank" rel="noopener">${esc(p[1])}</a><br>by ${esc(p[2])} · ${p[3]}</div></div>`; }).join("")}</div>`;
}

/* ---------- boot ---------- */
document.getElementById("lights").innerHTML = Array.from({ length: 30 }, (_, i) => `<span style="left:${i * 3.4 + 1}%;top:${10 + Math.sin(i / 29 * Math.PI) * 12}px;animation-delay:${(i % 5) * .5}s"></span>`).join("");
document.getElementById("pyBtn").onclick = () => { S.pinyin = !S.pinyin; save(); applyPy(); toast(S.pinyin ? "拼音 on: easier, keep practicing!" : "拼音 off: real night-market mode"); };
applyPy();
updateWallet();
home();
</script>
